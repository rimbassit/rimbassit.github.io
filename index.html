<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I See Counseling - Home</title>
    <style>
        :root {
            --navy: #1A1A3A;
            --red: #E82431;
            --systemic-orange: #E85E2E;
            --purple: #D067C0;
            --maroon: #7A1A6B;
            --sage-orange: #E18318;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: var(--navy);
            text-align: center;
        }

        /* Header & Navigation */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .main-logo {
            max-width: 350px;
            width: 100%;
            height: auto;
        }

        .hamburger {
            position: absolute;
            right: 30px;
            top: 40px;
            cursor: pointer;
        }

        .hamburger div {
            width: 25px;
            height: 3px;
            background-color: var(--navy);
            margin: 4px 0;
        }

        /* Divider Line */
        .divider {
            width: 90%;
            height: 1px;
            background-color: var(--maroon);
            margin: 0 auto 30px;
            opacity: 0.3;
        }

        /* Discover Link - Plain Navy Text */
        .discover-link {
            display: inline-block;
            color: var(--navy);
            text-decoration: none;
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 40px;
        }

        /* Icon Grid Layout */
        .nav-grid {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
            text-decoration: none;
            color: inherit;
        }

        .nav-item span {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.1rem;
            height: 50px;
            display: flex;
            align-items: center;
            text-align: center;
        }

        /* Circular Icons with 8px Red Border */
        .circle-icon {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 8px solid var(--red);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }

        .circle-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-grid {
                flex-direction: column;
                align-items: center;
            }
            .nav-item {
                width: 100%;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="images/main-logo.png" alt="I See Counseling" class="main-logo">
        <div class="hamburger">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>

    <div class="divider"></div>

    <a href="#" class="discover-link">Discover</a>

    <div class="nav-grid">
        <!-- Who We Are -->
        <a href="about.html" class="nav-item">
            <span>Who<br>We Are</span>
            <div class="circle-icon">
                <img src="images/who-we-are.png" alt="Who We Are">
            </div>
        </a>

        <!-- What We Offer -->
        <div class="nav-item">
            <span>What<br>We Offer</span>
            <div class="circle-icon">
                <img src="images/offer.png" alt="What We Offer">
            </div>
        </div>

        <!-- Our Vision -->
        <div class="nav-item">
            <span>Our<br>Vision</span>
            <div class="circle-icon">
                <img src="images/vision.png" alt="Our Vision">
            </div>
        </div>

        <!-- Contact Us -->
        <div class="nav-item">
            <span>Contact<br>Us</span>
            <div class="circle-icon">
                <img src="images/contact.png" alt="Contact Us">
            </div>
        </div>
    </div>

</body>
</html>
