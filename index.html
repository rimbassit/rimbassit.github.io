<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I See Counseling - Home</title>
    <style>
        /* Core Brand Colors */
        :root {
            --navy: #1A1A3A;
            --red: #E82431;
            --systemic-orange: #E85E2E;
            --purple: #D067C0;
            --maroon: #7A1A6B;
            --sage-orange: #E18318;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: var(--navy);
            text-align: center;
        }

        /* Header & Navigation */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .main-logo {
            max-width: 350px;
            height: auto;
        }

        .hamburger {
            position: absolute;
            right: 30px;
            top: 30px;
            cursor: pointer;
        }

        .hamburger div {
            width: 25px;
            height: 3px;
            background-color: var(--navy);
            margin: 4px 0;
        }

        /* Divider Line */
        .divider {
            width: 90%;
            height: 1px;
            background-color: var(--maroon);
            margin: 0 auto 30px;
            opacity: 0.5;
        }

        /* Discover Link - Plain Navy Text */
        .discover-link {
            display: inline-block;
            color: var(--navy);
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 40px;
        }

        /* Icon Grid Layout */
        .nav-grid {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 40px;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 180px;
        }

        .nav-item span {
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.2;
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        /* Circular Icons with 8px Red Border */
        .circle-icon {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 8px solid var(--red);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .circle-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .circle-icon:hover {
            transform: scale(1.05);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-grid {
                flex-direction: column;
                align-items: center;
            }
            
            .main-logo {
                max-width: 250px;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="main-logo.png" alt="I See Counseling Logo" class="main-logo">
        <div class="hamburger">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>

    <div class="divider"></div>

    <a href="#" class="discover-link">Discover</a>

    <div class="nav-grid">
        <!-- Who We Are -->
        <div class="nav-item">
            <span>Who<br>We Are</span>
            <a href="about.html" class="circle-icon">
                <img src="who-we-are.jpg" alt="Who We Are">
            </a>
        </div>

        <!-- What We Offer -->
        <div class="nav-item">
            <span>What<br>We Offer</span>
            <a href="#" class="circle-icon">
                <img src="offer.jpg" alt="What We Offer">
            </a>
        </div>

        <!-- Our Vision -->
        <div class="nav-item">
            <span>Our<br>Vision</span>
            <a href="#" class="circle-icon">
                <img src="vision.jpg" alt="Our Vision">
            </a>
        </div>

        <!-- Contact Us -->
        <div class="nav-item">
            <span>Contact<br>Us</span>
            <a href="#" class="circle-icon">
                <img src="contact.jpg" alt="Contact Us">
            </a>
        </div>
    </div>

</body>
</html>
