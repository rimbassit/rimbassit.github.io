<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I See Counseling - Home</title>
    <style>
        /* Core Brand Colors */
        :root {
            --navy: #1A1A3A;
            --red: #E82431;
            --systemic-orange: #E85E2E;
            --purple: #D067C0;
            --maroon: #7A1A6B;
            --sage-orange: #E18318;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: var(--navy);
            text-align: center;
        }

        /* Header & Dropdown Menu */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 1000;
        }

        .main-logo {
            max-width: 350px;
            width: 100%;
            height: auto;
        }

        .menu-container {
            position: absolute;
            right: 30px;
            top: 40px;
        }

        #menu-toggle {
            display: none;
        }

        .hamburger {
            cursor: pointer;
            display: block;
        }

        .hamburger div {
            width: 25px;
            height: 3px;
            background-color: var(--navy);
            margin: 4px 0;
            transition: 0.3s;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background-color: #ffffff;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.1);
            border: 1px solid #eee;
            text-align: right;
        }

        .dropdown-content a {
            color: var(--navy);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-weight: 500;
        }

        .dropdown-content a:hover {
            background-color: #f9f9f9;
            color: var(--red);
        }

        #menu-toggle:checked ~ .dropdown-content {
            display: block;
        }

        /* Divider Line */
        .divider {
            width: 90%;
            height: 1px;
            background-color: var(--maroon);
            margin: 0 auto 30px;
            opacity: 0.3;
        }

        /* Discover Text */
        .discover-text {
            display: block;
            color: var(--navy);
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 40px;
        }

        /* Icon Grid Layout */
        .nav-grid {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
            text-decoration: none;
            color: inherit;
        }

        .nav-item span {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.1rem;
            height: 50px;
            display: flex;
            align-items: center;
            text-align: center;
        }

        /* Icon Containers - No Border, Equal Sizing */
        .icon-container {
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
        }

        .icon-container img {
            width: 100%;
            height: 100%;
            /* 'contain' ensures the whole image fits the 160px box regardless of original dimensions */
            object-fit: contain; 
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-grid {
                flex-direction: column;
                align-items: center;
            }
            .nav-item {
                width: 100%;
                margin-bottom: 30px;
            }
            .main-logo {
                max-width: 280px;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="images/main-logo.png" alt="I See Counseling" class="main-logo">
        
        <div class="menu-container">
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="hamburger">
                <div></div>
                <div></div>
                <div></div>
            </label>
            <nav class="dropdown-content">
                <a href="about.html">About</a>
                <a href="#">Services</a>
                <a href="#">Vision</a>
                <a href="#">Contact Us</a>
            </nav>
        </div>
    </header>

    <div class="divider"></div>

    <span class="discover-text">Discover</span>

    <div class="nav-grid">
        <!-- Who We Are -->
        <a href="about.html" class="nav-item">
            <span>Who<br>We Are</span>
            <div class="icon-container">
                <img src="images/who-we-are.png" alt="Who We Are">
            </div>
        </a>

        <!-- What We Offer -->
        <div class="nav-item">
            <span>What<br>We Offer</span>
            <div class="icon-container">
                <img src="images/offer.png" alt="What We Offer">
            </div>
        </div>

        <!-- Our Vision -->
        <div class="nav-item">
            <span>Our<br>Vision</span>
            <div class="icon-container">
                <img src="images/vision.png" alt="Our Vision">
            </div>
        </div>

        <!-- Contact Us -->
        <div class="nav-item">
            <span>Contact<br>Us</span>
            <div class="icon-container">
                <img src="images/contact.png" alt="Contact Us">
            </div>
        </div>
    </div>

</body>
</html>
