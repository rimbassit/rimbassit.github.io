<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I See Counseling - Home</title>
    
    <style>
        :root {
            --navy: #1A1A3A;
            --red: #E82431;
            --systemic-orange: #E85E2E;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--white);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header / Logo Section */
        .hero-section {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 40px 0;
            border-bottom: 1px solid #ddd;
        }

        .main-logo {
            width: 90%;
            max-width: 500px;
            height: auto;
        }

        /* Discover Text - Navy & Simple */
        .discover-container {
            margin: 50px 0;
            text-align: center;
        }

        .discover-text {
            color: var(--navy);
            font-size: 2.8rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin: 0;
        }

        /* Icons Grid */
        .nav-icons-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            width: 90%;
            max-width: 1100px;
            margin-bottom: 80px;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .icon-item:hover {
            transform: translateY(-10px);
        }

        .icon-label {
            color: var(--navy);
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            line-height: 1.3;
        }

        .circular-icon {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            /* Using the Red/Orange border from your design */
            border: 8px solid var(--red); 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .circular-icon img {
            width: 85%;
            height: auto;
            object-fit: contain;
        }

        /* Responsive Breakpoints */
        @media (max-width: 850px) {
            .nav-icons-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 50px;
            }
            .circular-icon {
                width: 140px;
                height: 140px;
            }
        }

        @media (max-width: 480px) {
            .nav-icons-container {
                grid-template-columns: 1fr;
            }
            .discover-text {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Main Branding Header -->
    <header class="hero-section">
        <img src="butterfly logo_2.png" alt="I See Counseling" class="main-logo">
    </header>

    <!-- Discover Section -->
    <div class="discover-container">
        <h1 class="discover-text">Discover</h1>
    </div>

    <!-- Navigation Icons Section -->
    <nav class="nav-icons-container">
        
        <!-- Who We Are (about.html) -->
        <a href="about.html" class="icon-item">
            <p class="icon-label">Who<br>We Are</p>
            <div class="circular-icon">
                <!-- Using the 2 hands file for this section per your request -->
                <img src="2 hands.jpg" alt="Who We Are">
            </div>
        </a>

        <!-- What We Offer (services.html) -->
        <a href="services.html" class="icon-item">
            <p class="icon-label">What<br>We Offer</p>
            <div class="circular-icon">
                <img src="offer-icon.png" alt="What We Offer">
            </div>
        </a>

        <!-- Our Vision (vision.html) -->
        <a href="vision.html" class="icon-item">
            <p class="icon-label">Our<br>Vision</p>
            <div class="circular-icon">
                <img src="vision-icon.png" alt="Our Vision">
            </div>
        </a>

        <!-- Contact Us (contact.html) -->
        <a href="contact.html" class="icon-item">
            <p class="icon-label">Contact<br>Us</p>
            <div class="circular-icon">
                <img src="contact-icon.png" alt="Contact Us">
            </div>
        </a>

    </nav>

</body>
</html>
